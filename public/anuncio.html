<!--
  DETALHE DE ANÚNCIO

  listing-detail.js lê ?id=ID e preenche esta página.
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#008b8b" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#082426" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Detalhes de um anúncio no My Trade Box.">
    <title>Anúncio — My Trade Box</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
  </head>
  <body>
    <div class="site-header">
      <header class="nav">
        <a class="brand" href="index.html" aria-label="My Trade Box — página inicial">
          <img
            class="brand-badge"
            src="assets/favicon.svg"
            alt=""
            width="40"
            height="40"
            aria-hidden="true"
          >
          <img
            class="brand-wordmark"
            src="assets/logo-horizontal.svg"
            alt="My Trade Box"
            width="178"
            height="25"
          >
        </a>
        <nav aria-label="Principal">
          <a href="anuncios.html">Anúncios</a>
          <a href="index.html#como">Como funciona</a>
        </nav>
        <div class="auth-actions">
          <a class="secondary compact" href="anuncios.html">Voltar aos anúncios</a>
        </div>
      </header>
    </div>

    <main class="standalone-page">
      <section class="section listing-detail">
        <p id="listingDetailStatus" class="status">Carregando anúncio…</p>

        <div id="listingDetailContent" hidden>
          <div class="listing-detail-card">
            <div class="listing-detail-art">
              <img
                id="listingDetailCardImage"
                alt=""
                data-card-image
                tabindex="0"
                role="button"
              >
              <p class="meta">Imagem oficial da impressão</p>
            </div>

            <div class="listing-detail-copy">
              <div class="badge-row">
                <span id="listingDetailGame" class="badge game-badge"></span>
                <span id="listingDetailMode" class="badge"></span>
              </div>
              <h1 id="listingDetailTitle"></h1>
              <p id="listingDetailCardName" class="lead"></p>
              <p id="listingDetailMeta" class="meta"></p>
              <div id="listingDetailPrice" class="price listing-detail-price"></div>
              <p id="listingDetailDescription" class="description"></p>
              <p id="listingDetailDate" class="meta"></p>
            </div>
          </div>

          <section class="seller-card">
            <div>
              <p class="eyebrow">Anunciante</p>
              <h2 id="listingSellerName"></h2>
              <p id="listingSellerLocation" class="meta"></p>
            </div>

            <div class="seller-actions">
              <a id="listingSellerProfile" class="secondary" href="#">Ver perfil</a>
              <a id="listingSellerPhone" class="secondary" hidden>Telefonar</a>
              <a
                id="listingSellerWhatsapp"
                class="button"
                target="_blank"
                rel="noopener noreferrer"
                hidden
              >Abrir WhatsApp</a>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div class="site-footer">
      <footer>
        <div class="footer-brand">
          <img
            src="assets/logo-horizontal.svg"
            alt="My Trade Box"
            width="160"
            height="22"
            loading="lazy"
          >
          <span>Negociação direta entre jogadores</span>
        </div>
        <span>Dados e imagens oficiais: Scryfall &amp; TCGdex</span>
      </footer>
    </div>

    <script src="config.js"></script>
    <script src="page-common.js"></script>
    <script src="card-preview.js"></script>
    <script src="listing-detail.js"></script>
  </body>
</html>
