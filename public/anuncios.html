<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Todos os anúncios de compra, venda e troca do ManaPonte."
    >
    <title>Anúncios — ManaPonte</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
  </head>
  <body>
    <header class="nav">
      <a class="brand" href="index.html">Mana<span>Ponte</span></a>
      <nav>
        <a href="anuncios.html" aria-current="page">Anúncios</a>
        <a href="index.html#como">Como funciona</a>
      </nav>
      <div class="auth-actions">
        <a class="secondary compact" href="index.html">Início</a>
      </div>
    </header>

    <main class="standalone-page">
      <section class="section standalone-head">
        <p class="eyebrow">Marketplace</p>
        <h1>Todos os anúncios</h1>
        <p class="lead">
          Filtre por carta, coleção, cidade, estado ou modalidade e abra o
          perfil do anunciante para entrar em contato.
        </p>

        <form id="listingFilters" class="search standalone-filters">
          <label>
            <span>Carta</span>
            <input
              id="listingSearch"
              data-card-autocomplete
              list="listingCardSuggestions"
              placeholder="Ex.: Sol Ring"
              autocomplete="off"
            >
            <datalist id="listingCardSuggestions"></datalist>
          </label>

          <label>
            <span>Coleção</span>
            <select id="listingSet">
              <option value="">Todas</option>
            </select>
          </label>

          <label>
            <span>Cidade</span>
            <input id="listingCity" placeholder="Ex.: Natal" autocomplete="address-level2">
          </label>

          <label>
            <span>UF</span>
            <select id="listingState">
              <option value="">Brasil</option>
            </select>
          </label>

          <label>
            <span>Modalidade</span>
            <select id="listingMode">
              <option value="">Todas</option>
              <option value="venda">Venda</option>
              <option value="troca">Troca</option>
              <option value="ambos">Venda ou troca</option>
            </select>
          </label>

          <label>
            <span>Idioma da impressão</span>
            <select id="listingLanguage">
              <option value="">Todos os idiomas</option>
              <option value="pt">Português</option>
              <option value="en">Inglês</option>
              <option value="es">Espanhol</option>
              <option value="fr">Francês</option>
              <option value="de">Alemão</option>
              <option value="it">Italiano</option>
              <option value="ja">Japonês</option>
              <option value="ko">Coreano</option>
              <option value="ru">Russo</option>
              <option value="zhs">Chinês simplificado</option>
              <option value="zht">Chinês tradicional</option>
              <option value="he">Hebraico</option>
              <option value="la">Latim</option>
              <option value="grc">Grego antigo</option>
              <option value="ar">Árabe</option>
              <option value="sa">Sânscrito</option>
              <option value="ph">Phyrexiano</option>
              <option value="qya">Quenya</option>
            </select>
          </label>

          <label>
            <span>Condição</span>
            <select id="listingCondition">
              <option value="">Qualquer</option>
              <option value="NM">NM</option>
              <option value="SP">SP</option>
              <option value="MP">MP</option>
              <option value="HP">HP</option>
              <option value="DMG">DMG</option>
            </select>
          </label>

          <label>
            <span>Preço mínimo (R$)</span>
            <input id="listingMinPrice" type="number" min="0" step="0.01" placeholder="0,00">
          </label>

          <label>
            <span>Preço máximo (R$)</span>
            <input id="listingMaxPrice" type="number" min="0" step="0.01" placeholder="Sem limite">
          </label>

          <label>
            <span>Ordenar</span>
            <select id="listingSort">
              <option value="recent">Mais recentes</option>
              <option value="price_asc">Menor preço</option>
              <option value="price_desc">Maior preço</option>
              <option value="oldest">Mais antigos</option>
            </select>
          </label>

          <div class="filter-actions">
            <button class="button" type="submit">Filtrar anúncios</button>
            <button class="secondary" id="listingClear" type="button">Limpar filtros</button>
          </div>
        </form>
      </section>

      <section class="section standalone-results">
        <p id="listingPageStatus" class="status">Carregando anúncios…</p>
        <div id="listingPageGrid" class="grid"></div>

        <div
          id="listingPagePagination"
          class="listing-pagination"
          aria-label="Paginação dos anúncios"
          hidden
        >
          <button class="secondary compact" id="listingPrev" type="button">
            Anterior
          </button>
          <span id="listingPageNumber" class="meta">Página 1 de 1</span>
          <button class="secondary compact" id="listingNext" type="button">
            Próxima
          </button>
        </div>
      </section>
    </main>

    <footer>
      <strong>ManaPonte</strong>
      <span>Anúncios da comunidade</span>
      <span>Dados e imagens: Scryfall</span>
    </footer>

    <script src="config.js"></script>
    <script src="page-common.js"></script>
    <script src="card-preview.js"></script>
    <script src="card-autocomplete.js"></script>
    <script src="listings-page.js"></script>
  </body>
</html>
