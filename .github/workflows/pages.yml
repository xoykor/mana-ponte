# Publica o conteúdo da pasta public/ no GitHub Pages a cada push em main.
name: Publicar no GitHub Pages

# Também permitimos uma execução manual pela aba Actions do GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

# O deploy precisa ler o repositório, publicar páginas e emitir um token OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Se houver dois pushes seguidos, o deploy antigo é cancelado em favor do novo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      # 1. Obtém os arquivos versionados do repositório.
      - name: Baixar código
        uses: actions/checkout@v4

      # 2. Detecta se o site Pages já foi habilitado nas configurações do repo.
      #    Um repositório sem Pages não deve deixar o restante da CI vermelho.
      - name: Verificar GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(curl -sS             -o /tmp/pages.json             -w '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/pages")"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::notice::GitHub Pages ainda não está habilitado em Settings > Pages."
              ;;
            *)
              cat /tmp/pages.json
              echo "::error::Falha ao consultar o estado do GitHub Pages (HTTP $status)."
              exit 1
              ;;
          esac

      # 3. Configura metadados do Pages somente quando o site existe.
      - name: Configurar GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      # 4. Empacota somente a aplicação estática pública.
      - name: Preparar arquivos públicos
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 5. Publica o artefato e expõe sua URL no ambiente do job.
      - name: Publicar
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
