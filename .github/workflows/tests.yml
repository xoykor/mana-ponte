name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar diff
        run: git diff --check origin/main...HEAD

      - name: Verificar JavaScript
        run: |
          node --check public/app.js
          node --check public/card-picker.js
          node --check public/config.js

      - name: Executar suíte offline
        run: python3 -m unittest discover -s tests -v
