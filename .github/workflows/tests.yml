name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verificar diff
        run: git diff --check origin/main...HEAD

      - name: Verificar JavaScript
        run: |
          node --check public/app.js
          node --check public/card-picker.js
          node --check public/card-preview.js
          node --check public/page-common.js
          node --check public/listings-page.js
          node --check public/profile-page.js
          node --check public/card-autocomplete.js
          node --check public/listing-detail.js
          node --check public/config.js

          node --check cloudflare-worker/src/index.js
          node --check cloudflare-worker/src/lib.js
          node --check cloudflare-worker/src/auth.js
          node --check cloudflare-worker/src/catalog.js
          node --check cloudflare-worker/src/listings.js
          node --check cloudflare-worker/src/wants.js
